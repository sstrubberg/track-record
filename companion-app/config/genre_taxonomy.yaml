_meta:
  taxonomy_source: Discogs 400-style taxonomy (shared verbatim by the Discogs API/site and the discogs-maest
    audio model)
  reference: https://essentia.upf.edu/models.html#genre-discogs400
  notes:
  - canonical name is what Lexicon should display/store as the tag.
  - source_aliases map this canonical style to that source's own label for the same concept. discogs/discogs_maest
    are pre-filled because they use an identical taxonomy. beatport/spotify/musicbrainz are left null
    -- fill them in as you hit real examples so you're never guessing at their exact label strings.
  - primary is a per-track flag (not set here at the taxonomy level) for marking one subgenre as the main
    one on a track that carries several -- see chat notes.
  - mood/theme/energy tags are intentionally NOT in this file -- keep those as a separate taxonomy/category
    so they can be combined independently.
  - 'active flags (family-level and subgenre-level) control what actually ships to Track Record. Set active:
    true on a family to browse/consider its subgenres at all; set active: true on individual subgenres
    within an active family to include just those in the working set. Everything defaults to false --
    nothing is assumed relevant until you say so.'
