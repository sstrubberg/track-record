# Editable per-DJ retuning of how much each fetch source is trusted.
# Does not require touching code - see scoring.py for how these combine.
#
# confidence = 1 - Π(1 - weight_i * score_i)  across sources that found the tag
#
# Metadata sources (discogs) report score=1 (found it or didn't); model
# sources (audio_model, llm_web_search) report their own probability
# per tag, so weight here is the only lever for those.
#
# musicbrainz isn't listed here anymore - dropped as a fetch source
# entirely (see plan.py) after this project's own DJ found its
# suggestions consistently disappointing. fetch/musicbrainz.py itself
# is untouched, still works standalone, and this weight would still
# apply if it's ever wired back in - it's just not consulted while
# plan.py's SOURCES doesn't include it.

sources:
  discogs: 0.85
  llm_web_search: 0.6
  audio_model: 0.7

# Tags clearing this combined confidence, OR backed by this many
# independently agreeing sources, are auto-included: written straight to
# applied_log and never shown in the review screen.
auto_include:
  min_agreeing_sources: 2
  min_confidence: 0.85

# Tags below this confidence still surface in review, just visually
# flagged and unchecked by default (same as every other non-auto tag).
low_confidence_threshold: 0.35

# A fetch source will sometimes suggest a tag that doesn't exist in your
# Lexicon library at all (e.g. "Beatdown"). Set this to a Lexicon Custom
# Tag category name (you already have one called "Subgenre") to let
# Track Record create the tag there, spelled exactly as the source gave
# it - no renaming. Leave blank/unset to keep the old behavior: report
# the tag, create nothing.
#
# Creating a tag is always a review-screen decision, never
# auto-included, regardless of confidence - it's a bigger action than
# adding an existing tag to a track.
new_tag_category: ""
